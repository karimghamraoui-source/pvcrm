<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PV-CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PV-CRM">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#0f2a4a;--navy2:#17375e;--bg:#f3f6fa;--card:#fff;--tx:#14233a;--mut:#64748b;--bd:#dbe3ee;--green:#22a06b;--green-d:#178556;--red:#d63a3a;--amber:#e08a00;--inp:#fff;--hov:#eef3f9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1626;--card:#122238;--tx:#e6edf6;--mut:#93a4bb;--bd:#24385a;--inp:#0e1c30;--hov:#18304f}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
a{color:var(--green-d);text-decoration:none}a:hover{text-decoration:underline}
#app{display:flex;min-height:100%}
nav#side{width:220px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
nav#side .logo{padding:18px 18px 14px;font-weight:700;font-size:18px;letter-spacing:.3px}nav#side .logo span{color:#5ee0a6}
nav#side a{display:flex;gap:10px;align-items:center;color:#cfdcee;padding:11px 18px;text-decoration:none;border-left:3px solid transparent}
nav#side a:hover{background:var(--navy2)}nav#side a.on{background:var(--navy2);color:#fff;border-left-color:#5ee0a6}
nav#side a .n{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
#side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:#8fa6c4}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
header#top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
header#top h1{font-size:20px;margin:0;margin-right:auto}
main#main{padding:20px;max-width:1400px;width:100%}
.pill{border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.on{background:#dcf5e9;color:#117a4d}.pill.off{background:#fde3e3;color:#a32121}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;display:inline-flex;gap:6px;align-items:center;text-decoration:none;min-height:38px}
.btn:hover{background:var(--hov);text-decoration:none}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}.btn.pri:hover{background:var(--green-d)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}.btn.ok{background:#e4f7ee;border-color:#a9e3c6;color:#0e6b43}
.btn.dan{color:var(--red)}.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:block;color:inherit}
.kpi:hover{text-decoration:none;border-color:var(--green)}.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}.kpi.red b{color:var(--red)}.kpi.est{border-style:dashed}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.muted{color:var(--mut)}.red{color:var(--red)}.sm{font-size:13px}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600;color:#fff;background:var(--c,#64748b);white-space:nowrap}
.tag{border:1px solid var(--bd);border-radius:8px;padding:0 6px;font-size:11px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row:last-child{border-bottom:0}
.row.od{border-left:4px solid var(--red);padding-left:10px;background:rgba(214,58,58,.06)}.row.done{opacity:.6}
.rmain{flex:1;min-width:200px}.racts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.rs{font-size:13px;color:var(--mut)}
.prio-urgent{color:var(--red);font-weight:700}.prio-high{color:var(--amber);font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.4px;white-space:nowrap}tr:hover td{background:var(--hov)}
.tw{overflow-x:auto}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bar i{display:block;height:14px;border-radius:7px;background:var(--c,var(--green));min-width:3px}.bar .l{width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--inp);color:var(--tx);width:100%;min-height:38px}
.filters input,.filters select{width:auto}input[type=checkbox]{width:auto;min-height:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}label.f.chk{flex-direction:row;align-items:center;gap:8px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}.fg .w2{grid-column:1/-1}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,96vw);max-height:92vh;background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,38,.55)}
dialog form{padding:18px;max-height:92vh;overflow:auto}dialog h2{margin:0 0 12px}
details{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}
.err{color:var(--red);font-size:14px;margin:6px 0;min-height:1em}.warn{color:var(--amber);font-size:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}.tabs a.on{color:var(--tx);border-bottom-color:var(--green);font-weight:600}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}.dl div span{display:block;font-size:12px;color:var(--mut)}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:16px}.tl .it{position:relative;padding:6px 0 12px}.tl .it:before{content:"";position:absolute;left:-23px;top:11px;width:10px;height:10px;border-radius:5px;background:var(--green)}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{min-width:230px;width:230px;background:var(--hov);border-radius:12px;padding:8px;flex-shrink:0}.col.over{outline:2px dashed var(--green)}
.col h4{margin:4px 4px 8px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;margin-bottom:8px;cursor:grab;font-size:13px}.kc select{margin-top:6px;min-height:30px;padding:3px 6px;font-size:12px}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal7 .d{background:var(--card);border:1px solid var(--bd);border-radius:8px;min-height:92px;padding:5px;font-size:12px;overflow:hidden}
.cal7 .d.today{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.cal7 .d.dim{opacity:.45}.cal7 .hd{font-weight:600;text-align:center;font-size:12px;color:var(--mut)}
.chip{display:block;background:var(--c,#2b6cb0);color:#fff;border-radius:6px;padding:2px 5px;margin-top:3px;font-size:11px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip:hover{text-decoration:none;filter:brightness(1.1)}
#toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(380px,92vw)}
.toast{background:var(--navy);color:#fff;border-left:4px solid var(--green);padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}.toast.error{border-left-color:var(--red)}.toast.info{border-left-color:#5aa7ff}
#lock[hidden]{display:none!important}#lock{position:fixed;inset:0;background:var(--navy);z-index:200;display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:12px}
.hint{background:var(--hov);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.demo{background:#fff3cd;color:#7a5b00;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}
@media(max-width:860px){
 #app{flex-direction:column}
 nav#side{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
 nav#side .logo,#side .foot{display:none}nav#side a{flex-direction:column;gap:0;padding:7px 12px;font-size:11px;border-left:0;border-top:3px solid transparent;flex:1;min-width:64px;text-align:center;position:relative}
 nav#side a.on{border-top-color:#5ee0a6}nav#side a .n{position:absolute;top:2px;right:8px;margin:0;font-size:10px}
 main#main{padding:12px 12px 90px}header#top{padding:8px 12px}.hm{display:none}.btn .lbl{display:none}
 .cal7{grid-template-columns:1fr}.cal7 .hd{display:none}.cal7 .d.dim{display:none}.bar .l{width:100px}
}
@media print{nav#side,header#top{display:none}}
</style>
</head>
<body>
<div id="app">
 <nav id="side"></nav>
 <div id="content">
  <header id="top"><h1 id="title">PV-CRM</h1><span id="net" class="pill on">online</span>
   <button class="btn pri" data-act="newCustomer">＋ <span class="lbl">Neuer </span>Kunde</button>
   <button class="btn" data-act="planCb">📞 <span class="lbl">Rückruf planen</span></button>
   <button class="btn" data-act="newAppt">📅 <span class="lbl">Termin erstellen</span></button>
  </header>
  <main id="main"></main>
 </div>
</div>
<div id="toasts"></div>
<div id="lock" hidden></div>

<script>
'use strict';
/* ============ Utilities ============ */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const fDate=s=>s?s.split('-').reverse().join('.'):'';
const fTs=ts=>{if(!ts)return '';const d=new Date(ts);return `${fDate(ymd(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const num=v=>v===''||v==null?null:Number(String(v).replace(',','.'));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};

/* ============ IndexedDB ============ */
const STORES=['customers','projects','tasks','appointments','activities','settings'];
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('pvcrm',1);
 r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('DB blockiert'))})}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=(s,m)=>db.transaction(s,m).objectStore(s);
const dbAll=s=>rq(store(s,'readonly').getAll());
const dbPut=(s,o)=>rq(store(s,'readwrite').put(o));
const dbDel=(s,id)=>rq(store(s,'readwrite').delete(id));

/* ============ State ============ */
const KINDS={open:'laufend',won:'gewonnen',lost:'verloren',parked:'zurückgestellt'};
const DEF_STATUSES=[['Neuer Lead','open','#3b82f6'],['Noch nicht kontaktiert','open','#64748b'],['Erstkontakt hergestellt','open','#0ea5e9'],['Nicht erreicht','open','#f59e0b'],['Rückruf vereinbart','open','#8b5cf6'],['Qualifizierung läuft','open','#06b6d4'],['Beratungstermin vereinbart','open','#14b8a6'],['Beratung durchgeführt','open','#10b981'],['Angebot wird erstellt','open','#84cc16'],['Angebot versendet','open','#eab308'],['Nachfassen nach Angebot','open','#f97316'],['Verhandlung','open','#ec4899'],['Auftrag gewonnen','won','#16a34a'],['Auftrag verloren','lost','#dc2626'],['Langfristig interessant','parked','#7c3aed'],['Kein Interesse','lost','#9ca3af']].map((x,i)=>({id:'s'+(i+1),name:x[0],kind:x[1],color:x[2]}));
const DEF_PREFS={leadMin:15,dayTime:'08:30',overdueMin:0,quietOn:true,quietFrom:'20:00',quietTo:'07:00'};
const S={customers:[],projects:[],tasks:[],appointments:[],activities:[],statuses:[],prefs:{},fired:{},meta:{},tomb:[]};
async function load(){
 for(const k of ['customers','projects','tasks','appointments','activities'])S[k]=await dbAll(k);
 const m=Object.fromEntries((await dbAll('settings')).map(x=>[x.id,x.value]));
 S.statuses=m.statuses||DEF_STATUSES;S.prefs={...DEF_PREFS,...(m.prefs||{})};S.fired=m.fired||{};S.meta=m.meta||{};S.tomb=m.tomb||[];
 if(!m.statuses)await setSet('statuses',S.statuses);
}
const setSet=(id,value)=>dbPut('settings',{id,value,updatedAt:Date.now()});
async function save(st,o){const now=Date.now();if(!o.id){o.id=uid();o.createdAt=now}o.updatedAt=now;await dbPut(st,o);await load();return o}
async function remove(st,id){await dbDel(st,id);S.tomb.push({store:st,id,at:Date.now()});await setSet('tomb',S.tomb);await load()}
async function log(customerId,type,text,result){await save('activities',{customerId,type,text:text||'',result:result||'',at:Date.now()})}

/* ============ Domain helpers ============ */
const st=id=>S.statuses.find(s=>s.id===id)||{id,name:'–',color:'#888',kind:'open'};
const cust=id=>S.customers.find(c=>c.id===id);
const cname=c=>c?([c.firstName,c.lastName].filter(Boolean).join(' ')||c.company||'(ohne Name)'):'(gelöscht)';
const badge=id=>{const s=st(id);return `<span class="badge" style="--c:${esc(s.color)}">${esc(s.name)}</span>`};
const PRIO={low:1,normal:2,high:3,urgent:4},PRIOL={low:'niedrig',normal:'normal',high:'hoch',urgent:'dringend'};
const prioB=p=>p&&p!=='normal'?`<span class="prio-${p}">${PRIOL[p]}</span>`:'';
const dueTs=t=>new Date(t.date+'T'+(t.time||'23:59')).getTime();
const isOpen=t=>t.status==='open';
const overdue=t=>isOpen(t)&&dueTs(t)<Date.now();
const taskTitle=t=>t.kind==='callback'?`${t.contactType||'Anruf'}${t.reason?': '+t.reason:''}`:t.title;
const CALL_RES=['Nicht erreicht','Erneuter Anruf gewünscht','Interesse vorhanden','Kein Interesse','Termin vereinbart','Angebot gewünscht','Bedenkzeit','Rückmeldung steht aus'];
const RES2STATUS={'Nicht erreicht':'s4','Erneuter Anruf gewünscht':'s5','Interesse vorhanden':'s6','Kein Interesse':'s16','Termin vereinbart':'s7','Angebot gewünscht':'s9'};
const SOURCES=['Empfehlung','Telefonakquise','Werbung','Website','Partner','Sonstiges'];
const LOST=['Preis','Konkurrenz','Kein Interesse','Projekt verschoben','Nicht erreichbar','Sonstiges'];
const APPT_T=['Erstberatung','Vor-Ort-Termin','Dachbesichtigung','Angebotsbesprechung','Nachfassgespräch','Vertragsabschluss'];
const APPT_S=['geplant','bestätigt','durchgeführt','abgesagt','verschoben'];
const APPT_C={geplant:'#2b6cb0',bestätigt:'#16a34a',durchgeführt:'#64748b',abgesagt:'#dc2626',verschoben:'#e08a00'};
const OFFER_S=['Entwurf','Versendet','In Verhandlung','Gewonnen','Verloren'];
const TRI=[['','–'],['ja','Ja'],['nein','Nein']];
const normPhone=p=>{let d=(p||'').replace(/[^\d+]/g,'').replace(/^\+49/,'0').replace(/^0049/,'0');return d.replace(/\D/g,'')};
const tel=p=>String(p||'').replace(/[^\d+]/g,'');
const phoneLink=p=>p?`<a href="tel:${esc(tel(p))}">${esc(p)}</a>`:'';
const apptStart=a=>new Date(a.date+'T'+(a.start||'00:00')).getTime();
const activeAppt=a=>a.status==='geplant'||a.status==='bestätigt'||a.status==='verschoben';

function derive(){
 const m={};S.customers.forEach(c=>m[c.id]={nextCb:null,nextAppt:null,last:null,lastAny:c.createdAt||0,prio:0,od:false});
 for(const t of S.tasks){const d=m[t.customerId];if(!d||!isOpen(t))continue;
  d.prio=Math.max(d.prio,PRIO[t.priority]||2);if(overdue(t))d.od=true;
  if(t.kind==='callback'&&(!d.nextCb||dueTs(t)<dueTs(d.nextCb)))d.nextCb=t}
 for(const a of S.appointments){const d=m[a.customerId];if(!d||!activeAppt(a)||apptStart(a)<Date.now()-36e5)continue;if(!d.nextAppt||apptStart(a)<apptStart(d.nextAppt))d.nextAppt=a}
 for(const a of S.activities){const d=m[a.customerId];if(!d)continue;d.lastAny=Math.max(d.lastAny,a.at);
  if(['call','email','callback_done'].includes(a.type))d.last=Math.max(d.last||0,a.at)}
 return m;
}
function lastResult(cid){let best=null;for(const a of S.activities)if(a.customerId===cid&&a.result&&(!best||a.at>best.at))best=a;return best?best.result:''}

/* ============ UI helpers ============ */
function toast(msg,type='ok',ms=4000,url){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;
 t.onclick=()=>{t.remove();if(url)location.hash=url};$('#toasts').append(t);setTimeout(()=>t.remove(),ms)}
function F(name,label,val,o={}){
 const t=o.t||'text',req=o.req?' required':'';let inp;
 if(t==='select')inp=`<select name="${name}"${req}>${(o.opts||[]).map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}"${String(v)===String(val??'')?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;
 else if(t==='textarea')inp=`<textarea name="${name}" rows="${o.rows||3}">${esc(val)}</textarea>`;
 else if(t==='check')inp=`<input type="checkbox" name="${name}"${val?' checked':''}>`;
 else inp=`<input type="${t}" name="${name}" value="${esc(val)}"${req}${o.step?` step="${o.step}"`:''}${o.min!=null?` min="${o.min}"`:''}${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.inputmode?` inputmode="${o.inputmode}"`:''}>`;
 return `<label class="f ${o.cls||''}${t==='check'?' chk':''}">${t==='check'?inp+'<span>'+label+'</span>':'<span>'+label+'</span>'+inp}</label>`;
}
function modal(title,body,onSubmit,o={}){
 const d=document.createElement('dialog');
 d.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2>${body}<div class="err" role="alert"></div><div class="acts"><button type="button" class="btn" data-close>Abbrechen</button>${o.noSubmit?'':`<button class="btn pri" type="submit">${esc(o.ok||'Speichern')}</button>`}</div></form>`;
 document.body.append(d);d.showModal();
 const form=$('form',d),err=$('.err',d);d.addEventListener('close',()=>d.remove());
 $('[data-close]',d).onclick=()=>d.close();
 form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';
  try{const r=await onSubmit(new FormData(form),form,err);if(r===false)return;d.close();if(o.after)o.after()}catch(ex){console.error(ex);err.textContent='Fehler: '+(ex.message||ex)}});
 return d;
}
const custOpts=(withEmpty)=>[...(withEmpty?[['','– kein Kundenbezug –']]:[]),...S.customers.filter(c=>!c.archived).sort((a,b)=>cname(a).localeCompare(cname(b),'de')).map(c=>[c.id,cname(c)+(c.city?' ('+c.city+')':'')])];
const statusOpts=()=>S.statuses.map(s=>[s.id,s.name]);
const fdv=(fd,k)=>String(fd.get(k)??'').trim();

/* ============ Customer dialog ============ */
let dupConfirmed=null;
function findDupes(v,selfId){

 return S.customers.filter(c=>c.id!==selfId&&(
  (em&&(c.email||'').toLowerCase()===em)||
  [p1,p2].some(p=>p.length>=6&&[normPhone(c.phone),normPhone(c.mobile)].includes(p))||
  (v.lastName&&v.zip&&c.lastName&&c.lastName.toLowerCase()===v.lastName.toLowerCase()&&(c.firstName||'').toLowerCase()===(v.firstName||'').toLowerCase()&&c.zip===v.zip)));
}
function validateCust(v){
 if(!v.firstName&&!v.lastName&&!v.company)return 'Bitte mindestens Name oder Firma angeben.';
 if(v.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email))return 'Die E-Mail-Adresse ist ungültig.';
 for(const k of ['phone','mobile'])if(v[k]&&!/^[+\d][\d\s()\/.\-]{4,}$/.test(v[k]))return 'Die Telefonnummer ist ungültig (z. B. 0171 1234567 oder +49 171 1234567).';
 if(v.zip&&!/^\d{5}$/.test(v.zip))return 'Die Postleitzahl muss fünfstellig sein.';

 return '';
}

/* ============ Reminders ============ */
function inQuiet(ts){const q=S.prefs;if(!q.quietOn)return false;const d=new Date(ts),m=d.getHours()*60+d.getMinutes();
 const [fh,fm]=q.quietFrom.split(':').map(Number),[th,tm]=q.quietTo.split(':').map(Number),f=fh*60+fm,t=th*60+tm;
 return f<=t?(m>=f&&m<t):(m>=f||m<t)}
function reminderItems(){
 const out=[],P=S.prefs;
 for(const t of S.tasks){if(!isOpen(t))continue;const c=cust(t.customerId);
  let at;if(t.remDate)at=new Date(t.remDate+'T'+(t.remTime||P.dayTime)).getTime();
  else if(t.time)at=dueTs(t)-P.leadMin*60000;else at=new Date(t.date+'T'+P.dayTime).getTime();
  const body=`${c?cname(c)+' · ':''}fällig ${fDate(t.date)}${t.time?' '+t.time+' Uhr':''}${t.description?' · '+t.description.slice(0,80):''}`;
  const url=c?'#/customer/'+c.id+'/tasks':'#/tasks';
  out.push({key:`t:${t.id}:${at}`,at,title:(t.kind==='callback'?'📞 ':'✅ ')+taskTitle(t),body,url});
  if(P.overdueMin>0&&overdue(t)){const n=Math.floor((Date.now()-dueTs(t))/(P.overdueMin*60000));if(n>=1)out.push({key:`o:${t.id}:${dueTs(t)}:${n}`,at:Date.now(),title:'⚠ Überfällig: '+taskTitle(t),body,url})}}
 for(const a of S.appointments){if(!['geplant','bestätigt'].includes(a.status)||a.remindMin==='')continue;const c=cust(a.customerId);
  out.push({key:`a:${a.id}:${a.date}${a.start}:${a.remindMin}`,at:apptStart(a)-Number(a.remindMin)*60000,title:`📅 ${a.type} um ${a.start} Uhr`,body:`${c?cname(c):''}${a.address?' · '+a.address:''}`,url:c?'#/customer/'+c.id+'/appts':'#/appointments'})}
 return out;
}
async function notify(it){
 toast(`🔔 ${it.title} – ${it.body}`,'info',9000,it.url);
 if('Notification'in window&&Notification.permission==='granted'){
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const o={body:it.body,tag:it.key,data:{url:it.url},icon:'icon-192.png'};
   if(reg)await reg.showNotification(it.title,o);else new Notification(it.title,o)}catch(e){console.warn(e)}}
}
let checking=false;
async function checkReminders(){
 if(checking||!db)return;checking=true;
 try{const now=Date.now();const items=reminderItems().filter(i=>i.at<=now&&!S.fired[i.key]);
  if(items.length&&inQuiet(now)){return}
  const fresh=items.filter(i=>now-i.at<24*36e5);let changed=false;
  items.forEach(i=>{S.fired[i.key]=now;changed=true});
  if(fresh.length>3){toast(`🔔 ${fresh.length} Erinnerungen fällig bzw. verpasst – siehe Rückrufe.`,'info',9000,'#/followups');
   if(Notification.permission==='granted')notify({key:'sum:'+now,title:`${fresh.length} Erinnerungen fällig`,body:'Offene Rückrufe und Aufgaben ansehen',url:'#/followups'})}
  else for(const i of fresh)await notify(i);
  for(const k of Object.keys(S.fired))if(now-S.fired[k]>14*864e5){delete S.fired[k];changed=true}
  if(changed)await setSet('fired',S.fired);
 }finally{checking=false}
}

const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsDT=(d,t)=>d.replace(/-/g,'')+'T'+(t||'09:00').replace(':','')+'00';
function icsEvent(o){return ['BEGIN:VEVENT','UID:'+o.uid+'@pv-crm','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+o.s,'DTEND:'+o.e,'SUMMARY:'+icsEsc(o.sum),'DESCRIPTION:'+icsEsc(o.desc),o.loc?'LOCATION:'+icsEsc(o.loc):'','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(o.sum),'TRIGGER:-PT'+o.alarm+'M','END:VALARM','END:VEVENT'].filter(Boolean)}
function taskIcs(t){const c=cust(t.customerId),t0=t.time||S.prefs.dayTime;const [h,m]=t0.split(':').map(Number);const e=pad(Math.floor((h*60+m+15)/60)%24)+':'+pad((h*60+m+15)%60);
 return icsEvent({uid:t.id,s:icsDT(t.date,t0),e:icsDT(t.date,e),sum:(c?cname(c)+' – ':'')+taskTitle(t),desc:t.description,alarm:t.time?S.prefs.leadMin:0})}
function apptIcs(a){const c=cust(a.customerId);return icsEvent({uid:a.id,s:icsDT(a.date,a.start),e:icsDT(a.date,a.end),sum:`${a.type}${c?' – '+cname(c):''}`,desc:a.prep,loc:a.address,alarm:Number(a.remindMin||15)})}
function download(name,content,mime){const b=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},2000)}

const CSV_COLS=[['firstName','Vorname'],['lastName','Nachname'],['company','Firma'],['type','Kundentyp'],['street','Straße'],['zip','PLZ'],['city','Ort'],['phone','Telefon'],['mobile','Mobil'],['email','E-Mail'],['source','Quelle'],['statusId','Status'],['consumption','Stromverbrauch kWh'],['notes','Notizen']];

function parseCSV(txt){txt=txt.replace(/^\uFEFF/,'');const first=txt.split(/\r?\n/)[0]||'';const dl=first.split(';').length>=first.split(',').length?';':',';
 const rows=[];let row=[],cur='',q=false;

async function backupImport(file){
 try{const j=JSON.parse(await file.text());if(j.app!=='pv-crm'||!j.data)throw new Error('Keine gültige PV-CRM-Sicherung.');
  let added=0,upd=0,del=0;const D=j.data;
  for(const sname of ['customers','projects','tasks','appointments','activities']){const cur=new Map(S[sname].map(x=>[x.id,x]));
   for(const r of D[sname]||[]){const e=cur.get(r.id);if(!e){await dbPut(sname,r);added++}else if((r.updatedAt||0)>(e.updatedAt||0)){await dbPut(sname,r);upd++}}}
  const tomb=[...S.tomb];for(const t of D.tomb||[])if(!tomb.some(x=>x.id===t.id&&x.store===t.store))tomb.push(t);
  await setSet('tomb',tomb);await load();
  for(const t of S.tomb){const e=(S[t.store]||[]).find(x=>x.id===t.id);if(e&&(e.updatedAt||0)<t.at){await dbDel(t.store,t.id);del++}}
  const have=new Set(S.statuses.map(s=>s.id));const ns=(D.statuses||[]).filter(s=>!have.has(s.id));if(ns.length)await setSet('statuses',[...S.statuses,...ns]);
  await load();toast(`Import fertig: ${added} neu, ${upd} aktualisiert, ${del} gelöscht.`,'ok',8000);render();
 }catch(e){toast('Import fehlgeschlagen: '+e.message,'error',8000)}
}

 saveView:async()=>{const name=prompt('Name der Ansicht:');if(!name)return;const {q,status,source,prio,due,sort,fav,arch}=UI.cust;S.prefs.views=[...(S.prefs.views||[]),{name,f:{q,status,source,prio,due,sort,fav,arch}}];await setSet('prefs',S.prefs);toast('Ansicht gespeichert.');render()},
 delViews:async()=>{if(!confirm('Alle gespeicherten Ansichten löschen?'))return;S.prefs.views=[];await setSet('prefs',S.prefs);render()},
 resetFilters:()=>{Object.assign(UI.cust,{q:'',status:'',source:'',prio:'',due:'',sort:'name',fav:false,arch:false});UI.cust.sel.clear();render()},
 exportCSV:()=>exportCSV(filteredCustomers().map(x=>x.c)),bulkExport:()=>exportCSV(S.customers.filter(c=>UI.cust.sel.has(c.id))),bulkClear:()=>{UI.cust.sel.clear();render()},
 bulkArch:async()=>{for(const id of UI.cust.sel){const c=cust(id);c.archived=true;await save('customers',c)}toast(UI.cust.sel.size+' archiviert.');UI.cust.sel.clear();render()},
 stAdd:async()=>{S.statuses.push({id:'s'+uid().slice(0,8),name:'Neuer Status',kind:'open',color:'#3b82f6'});await setSet('statuses',S.statuses);render()},
 stDel:async el=>{if(S.customers.some(c=>c.statusId===el.dataset.id))return toast('Status wird noch von Kunden verwendet – diese zuerst umstellen.','error');S.statuses=S.statuses.filter(s=>s.id!==el.dataset.id);await setSet('statuses',S.statuses);render()},
 stUp:async el=>{const i=+el.dataset.i;if(i>0){[S.statuses[i-1],S.statuses[i]]=[S.statuses[i],S.statuses[i-1]];await setSet('statuses',S.statuses);render()}},
 stDn:async el=>{const i=+el.dataset.i;if(i<S.statuses.length-1){[S.statuses[i+1],S.statuses[i]]=[S.statuses[i],S.statuses[i+1]];await setSet('statuses',S.statuses);render()}},
 notifEnable:async()=>{if(!('Notification'in window))return toast('Dieser Browser unterstützt keine Benachrichtigungen.','error');const r=await Notification.requestPermission();toast(r==='granted'?'Benachrichtigungen erlaubt.':'Berechtigung: '+r,r==='granted'?'ok':'error');render()},
 notifTest:async()=>{if(Notification.permission!=='granted')toast('Hinweis: Systembenachrichtigungen sind nicht erlaubt – nur In-App-Hinweis.','info');await notify({key:'test:'+Date.now(),title:'🔔 Testbenachrichtigung',body:'PV-CRM Erinnerungen funktionieren.',url:'#/settings'})},
 backupExport,backupShare:async()=>{const f=new File([JSON.stringify(backupData(),null,1)],`pv-crm-backup-${today()}.json`,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'PV-CRM Backup'});S.meta.lastBackup=Date.now();await setSet('meta',S.meta);toast('Backup geteilt.');render()}catch(e){if(e.name!=='AbortError')toast('Teilen fehlgeschlagen: '+e.message,'error')}}else{toast('Teilen wird hier nicht unterstützt – Datei wird heruntergeladen.','info');await backupExport()}},persist:async()=>{try{const ok=navigator.storage&&navigator.storage.persist&&await navigator.storage.persist();toast(ok?'Dauerhafter Speicher zugesagt.':'Der Browser hat dauerhaften Speicher nicht zugesagt (bei installierter App meist möglich).',ok?'ok':'info',7000)}catch{toast('Nicht unterstützt.','error')}render()},
 icsTask:el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);download('aufgabe.ics',icsFile([taskIcs(t)]),'text/calendar')},
 icsAppt:el=>{const a=S.appointments.find(x=>x.id===el.dataset.id);download('termin.ics',icsFile([apptIcs(a)]),'text/calendar')},
 icsAll:()=>{const ev=[...S.tasks.filter(isOpen).map(taskIcs),...S.appointments.filter(a=>activeAppt(a)&&a.date>=today()).map(apptIcs)];if(!ev.length)return toast('Nichts zu exportieren.','info');download('pv-crm-erinnerungen.ics',icsFile(ev),'text/calendar');toast(ev.length+' Einträge exportiert – Datei in die Kalender-App importieren.')},
 install:async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;render()},
 setPin:()=>modal('App-PIN',`${F('p1','Neue PIN (mind. 4 Zeichen)','',{t:'password'})}${F('p2','PIN wiederholen','',{t:'password'})}`,async fd=>{const p=fdv(fd,'p1');if(p.length<4||p!==fdv(fd,'p2'))throw new Error('PIN zu kurz oder Eingaben unterschiedlich.');const salt=uid();S.prefs.pinSalt=salt;S.prefs.pinHash=await sha(salt+p);await setSet('prefs',S.prefs);toast('PIN gesetzt.');render()}),
 rmPin:async()=>{delete S.prefs.pinHash;delete S.prefs.pinSalt;await setSet('prefs',S.prefs);toast('PIN entfernt.');render()},lock:()=>showLock(),
 demoLoad:async()=>{await loadDemo();toast('Demodaten geladen.');render()},
 demoRemove:async()=>{for(const c of S.customers.filter(c=>c.demo))await deleteCustomer(c.id);toast('Demodaten entfernt.');render()},
 wipe:async()=>{if(!confirm('ALLE Daten auf diesem Gerät unwiderruflich löschen?')||prompt('Zur Bestätigung „LÖSCHEN“ eingeben:')!=='LÖSCHEN')return;for(const s of ['customers','projects','tasks','appointments','activities'])for(const o of S[s])await dbDel(s,o.id);S.tomb=[];await setSet('tomb',[]);await load();toast('Alle Daten gelöscht.');render()}
};
async function deleteCustomer(id){for(const [s,k] of [['tasks','customerId'],['appointments','customerId'],['projects','customerId'],['activities','customerId']])for(const o of S[s].filter(x=>x[k]===id))await remove(s,o.id);await remove('customers',id)}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

const CH={
 selAll:el=>{const l=filteredCustomers();l.forEach(x=>el.checked?UI.cust.sel.add(x.c.id):UI.cust.sel.delete(x.c.id));refreshList()},
 sel:el=>{el.checked?UI.cust.sel.add(el.dataset.id):UI.cust.sel.delete(el.dataset.id);$('#bulk').innerHTML=bulkBar()},
 f_status:v=>{UI.cust.status=v.value;refreshList()},f_source:v=>{UI.cust.source=v.value;refreshList()},f_prio:v=>{UI.cust.prio=v.value;refreshList()},f_due:v=>{UI.cust.due=v.value;refreshList()},f_sort:v=>{UI.cust.sort=v.value;refreshList()},
 f_fav:v=>{UI.cust.fav=v.checked;refreshList()},f_arch:v=>{UI.cust.arch=v.checked;refreshList()},
 applyView:el=>{const v=(S.prefs.views||[])[+el.value];if(v){Object.assign(UI.cust,v.f);render()}},
 csvFile:el=>{if(el.files[0])importCSV(el.files[0]);el.value=''},backupFile:el=>{if(el.files[0])backupImport(el.files[0]);el.value=''},
 bulkStatus:async el=>{if(!el.value)return;for(const id of UI.cust.sel)await setStatus(id,el.value);UI.cust.sel.clear();render()},
 custStatus:el=>askStatus(el.dataset.id,el.value),
 notes:async el=>{const c=cust(el.dataset.id);if(c.notes===el.value)return;c.notes=el.value;await save('customers',c);toast('Notiz gespeichert.')},
 stName:async el=>{const s=S.statuses.find(x=>x.id===el.dataset.id);if(!el.value.trim())return render();s.name=el.value.trim();await setSet('statuses',S.statuses);toast('Gespeichert.')},
 stColor:async el=>{S.statuses.find(x=>x.id===el.dataset.id).color=el.value;await setSet('statuses',S.statuses)},
 stKind:async el=>{S.statuses.find(x=>x.id===el.dataset.id).kind=el.value;await setSet('statuses',S.statuses);toast('Gespeichert.')}
};
function refreshList(){$('#custTable').innerHTML=custTable();$('#bulk').innerHTML=bulkBar()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){if(el.tagName==='A'&&el.getAttribute('href')==='javascript:void 0')e.preventDefault();Promise.resolve(f(el,e)).catch(x=>{console.error(x);toast('Fehler: '+x.message,'error')})}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const k=el.dataset.change;
 if(k.startsWith('pref_')){const key=k.slice(5);S.prefs[key]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value)||0:el.value;setSet('prefs',S.prefs).then(()=>toast('Gespeichert.'));return}
 CH[k]&&Promise.resolve(CH[k](el)).catch(x=>{console.error(x);toast('Fehler: '+x.message,'error')})});
document.addEventListener('input',e=>{if(e.target.dataset.input==='q'){UI.cust.q=e.target.value;refreshList()}});
/* Pipeline drag & drop */
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('[data-drag]');if(k){e.dataTransfer.setData('text/plain',k.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)askStatus(id,c.dataset.drop)});

/* ============ Lock ============ */
function showLock(){const L=$('#lock');L.hidden=false;L.innerHTML=`<div style="font-size:42px">☀</div><h2>PV-CRM gesperrt</h2><input id="pin" type="password" placeholder="PIN" style="max-width:220px;text-align:center" autocomplete="off"><div id="lerr" class="warn"></div><button class="btn pri" id="unl">Entsperren</button>`;
 const go=async()=>{if(await sha(S.prefs.pinSalt+$('#pin').value)===S.prefs.pinHash){L.hidden=true;L.innerHTML=''}else{$('#lerr').textContent='Falsche PIN.';$('#pin').value=''}};$('#unl').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};$('#pin').focus()}

/* ============ Demo data ============ */
async function loadDemo(){
 const T=today(),D=[['Anna','Beispiel','Musterstadt','80331','0171 1234567','s4',9800,'Website'],['Bernd','Demo','Beispielheim','50667','0221 123456','s10',4200,'Empfehlung'],['Clara','Testfrau','Demoburg','10115','030 123456','s1',6100,'Werbung'],['Dieter','Probst','Testhausen','70173','0711 123456','s7',12500,'Telefonakquise'],['Eva','Muster','Musterstadt','80331','0172 7654321','s13',5400,'Partner']];
 for(const [i,x] of D.entries()){const c=await save('customers',{firstName:x[0],lastName:x[1],city:x[2],zip:x[3],street:'Musterweg '+(i+1),phone:x[4],type:'Privatkunde',statusId:x[5],consumption:x[6],source:x[7],buildingType:'Einfamilienhaus',ownership:'Eigentümer',demo:true,notes:'Demodatensatz'});
  await log(c.id,'note','Demodatensatz angelegt');
  if(i===0)await save('tasks',{kind:'callback',status:'open',customerId:c.id,contactType:'Anruf',reason:'Erneut versuchen',date:addDays(T,-1),time:'10:00',priority:'high',description:'Demo: überfällig'});
  if(i===1)await save('tasks',{kind:'callback',status:'open',customerId:c.id,contactType:'Anruf',reason:'Nach Angebot fragen',date:T,time:'',window:'Nachmittag',priority:'normal',description:'Demo: heute fällig'});
  if(i===2)await save('tasks',{kind:'callback',status:'open',customerId:c.id,contactType:'Anruf',reason:'Erstkontakt',date:addDays(T,1),time:'10:30',priority:'normal',description:'Demo: morgen'});
  if(i===3){await save('appointments',{customerId:c.id,date:addDays(T,2),start:'14:00',end:'15:30',type:'Dachbesichtigung',status:'bestätigt',address:'Musterweg 4, 70173 Testhausen',remindMin:'60',prep:'Dachfläche messen'});await save('projects',{customerId:c.id,name:'PV 12 kWp + Speicher',value:28000,kwp:12,kwh:10,offerStatus:'Versendet',offerDate:T,demo:true})}
  if(i===4)await save('projects',{customerId:c.id,name:'PV 8 kWp',value:14500,kwp:8,offerStatus:'Gewonnen',actualClose:T,demo:true})}
}

/* ============ Boot ============ */
(async function boot(){
 try{
  db=await openDB();await load();netUI();
  if(S.prefs.pinHash)showLock();
  render();
  if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){
   navigator.serviceWorker.register('sw.js').then(r=>{swInfo='aktiv – App ist offline startbar';if(location.hash.includes('settings'))render()}).catch(e=>{swInfo='nicht verfügbar ('+(e.message||e)+')'})}
  else swInfo='nicht verfügbar (benötigt HTTPS/localhost und sw.js)';
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
  navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.url)location.hash=e.data.url});
  checkReminders();setInterval(checkReminders,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
  setInterval(()=>{if(!document.hidden&&!document.querySelector('dialog[open]'))render()},120000);
 }catch(e){console.error(e);$('#main').innerHTML=`<div class="card"><h2>Datenbank nicht verfügbar</h2><p>IndexedDB konnte nicht geöffnet werden (${esc(e.message||e)}). Private Browser-Fenster oder blockierte Website-Daten verhindern die Speicherung.</p></div>`}
})();
</script>
